name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DuoLikeAnimation.xcodeproj \
            -scheme DuoLikeAnimation \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Make IPA
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          cp -R "$APP" Payload/
          zip -r DuoLikeAnimation.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DuoLikeAnimation-IPA
          path: DuoLikeAnimation.ipa
